---
- name: Atualizações | Instala o unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

# 20auto-upgrades liga as rotinas diárias do apt (atualizar listas e aplicar).
- name: Atualizações | Liga as rotinas diárias do apt
  ansible.builtin.template:
    src: apt_20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# O 50unattended-upgrades do pacote já restringe as origens à segurança do
# Ubuntu. Este arquivo vem depois na ordem alfabética e só ajusta opções.
- name: Atualizações | Grava os ajustes do unattended-upgrades
  ansible.builtin.template:
    src: apt_52unattended-upgrades-hardening.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-hardening
    owner: root
    group: root
    mode: "0644"

- name: Atualizações | Habilita os timers do apt
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
